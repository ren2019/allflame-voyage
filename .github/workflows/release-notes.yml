name: Release notes

on:
  pull_request:

permissions:
  contents: read

jobs:
  release-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check:release-notes -- --base "$RELEASE_BASE"
        env:
          RELEASE_BASE: ${{ github.event.pull_request.base.sha }}
      - run: npx vitest run tests/release-notes.test.ts
