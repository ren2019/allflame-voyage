name: 问题反馈
description: 国服导入、摆盘或界面问题
body:
  - type: textarea
    id: what-happened
    attributes:
      label: 问题与复现步骤
      description: 做了什么、预期结果和实际结果分别是什么？请先移除无关个人信息。
    validations:
      required: true
  - type: textarea
    id: chart-text
    attributes:
      label: 海图高级复制原文（导入问题）
      description: >
        请粘贴 Ctrl+Alt+C 得到的完整物品文本，并说明客户端版本。
        只提供复现所需样本，不提交完整私人库存、证书或浏览器数据。
  - type: input
    id: display
    attributes:
      label: 浏览器与显示设置
      placeholder: 例如 Edge，2560×1440，缩放 125%
